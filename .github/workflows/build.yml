name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional real release-signing secrets. If these aren't configured in the
      # repo (Settings -> Secrets and variables -> Actions), the release build
      # below automatically falls back to signing with the debug keystore, so
      # the workflow always succeeds and always produces an installable release
      # APK - just add these secrets later to switch to a properly signed one:
      #   RELEASE_KEYSTORE_BASE64  - `base64 -w0 your.keystore` output
      #   RELEASE_STORE_PASSWORD
      #   RELEASE_KEY_ALIAS
      #   RELEASE_KEY_PASSWORD
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_FILE: ${{ github.workspace }}/app/release.keystore
      # AdMob ids (free AdMob account). Without them the build uses Google's TEST ads.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses and install platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f | head -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Regenerate Gradle wrapper
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip wget
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore (optional)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Make the version code go up on every build
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moneta-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: moneta-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Build Play Store bundle (AAB)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Play Store bundle
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: moneta-play-store-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Note - no Play Store bundle without an upload key
        if: env.RELEASE_KEYSTORE_BASE64 == ''
        run: echo "::warning::No RELEASE_KEYSTORE_BASE64 secret, so no Play Store bundle was made. Run the 'Create upload key' workflow first (see PLAY_STORE_SETUP.md)."
