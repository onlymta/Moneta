name: Create upload key

# Run this ONCE (Actions > Create upload key > Run workflow). It makes the signing key Google Play
# needs and hands it to you as a downloadable file. Keep this repository PRIVATE.
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Choose a password (6+ characters, letters and numbers). Write it down.'
        required: true
      alias:
        description: 'Key alias'
        required: true
        default: 'upload'

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        env:
          PW: ${{ inputs.password }}
          KEY_ALIAS: ${{ inputs.alias }}
        run: |
          mkdir out
          keytool -genkeypair -v -keystore out/moneta-upload.jks -storetype PKCS12 \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Moneta, O=Moneta, C=PK"
          base64 -w0 out/moneta-upload.jks > out/moneta-upload.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moneta-upload-key
          path: out/
          retention-days: 3
